<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
  <title>רישום משמרת - מכלול תכנון</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #263347;
      --accent: #3b82f6; --text: #e2e8f0; --muted: #64748b;
      --border: rgba(255,255,255,0.1); --green: #22c55e; --red: #ef4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 24px; max-width: 390px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .logo { font-size: 2.2rem; text-align: center; margin-bottom: 4px; }
    .brand { text-align: center; font-size: 0.78rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 24px; }
    .emp-name {
      font-size: 1.5rem; font-weight: 800; color: #93c5fd;
      text-align: center; margin-bottom: 20px;
    }
    .info-box {
      background: var(--surface2); border-radius: 14px; padding: 16px;
      margin-bottom: 20px; border: 1px solid var(--border);
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 0;
    }
    .info-label { color: var(--muted); font-size: 0.82rem; }
    .info-val { font-weight: 700; font-size: 0.95rem; }
    .window-hint {
      text-align: center; font-size: 0.82rem; color: var(--muted);
      margin-bottom: 20px; padding: 9px 14px;
      background: rgba(59,130,246,0.08); border-radius: 10px;
      border: 1px solid rgba(59,130,246,0.2);
    }
    .window-hint strong { color: #93c5fd; }
    .section-title {
      font-size: 0.78rem; color: var(--muted); text-align: center;
      margin-bottom: 12px; letter-spacing: 0.5px;
    }
    .time-pair {
      display: flex; gap: 12px; margin-bottom: 20px; direction: ltr;
      align-items: flex-end;
    }
    .time-field { flex: 1; }
    .time-field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; direction: rtl; text-align: right; }
    .time-selects { display: flex; gap: 6px; }
    select {
      flex: 1; padding: 13px 6px; border-radius: 10px;
      background: var(--surface2); border: 2px solid var(--border);
      color: var(--text); font-size: 1.15rem; font-weight: 700;
      text-align: center; cursor: pointer; appearance: none; -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    select:focus { outline: none; border-color: var(--accent); }
    .dash { font-size: 1.4rem; color: var(--muted); padding-bottom: 12px; align-self: center; }
    .btn {
      width: 100%; padding: 17px; border-radius: 14px; border: none;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      margin-top: 4px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; box-shadow: 0 4px 16px rgba(37,99,235,0.4);
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    /* States */
    #loading { text-align: center; padding: 30px 0; color: var(--muted); font-size: 1rem; }
    #error-screen, #submitted-screen, #success-screen { display: none; text-align: center; }
    .big-icon { font-size: 4rem; margin-bottom: 14px; }
    .state-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
    .state-title.green { color: var(--green); }
    .state-title.red { color: var(--red); }
    .state-title.blue { color: #93c5fd; }
    .state-details { color: var(--muted); font-size: 0.88rem; line-height: 1.7; margin-bottom: 8px; }
    .success-time { font-size: 2rem; font-weight: 900; color: var(--text); margin: 10px 0; }
    .footer-note { margin-top: 16px; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
<div class="card">

  <!-- Loading -->
  <div id="loading">⏳<br><br>טוען טופס...</div>

  <!-- Error -->
  <div id="error-screen">
    <div class="big-icon">❌</div>
    <div class="state-title red">קישור לא תקין</div>
    <div class="state-details" id="error-msg">הקישור לא תקין או שפג תוקפו.</div>
  </div>

  <!-- Already submitted -->
  <div id="submitted-screen">
    <div class="big-icon">🔒</div>
    <div class="state-title blue">כבר נרשמת</div>
    <div class="state-details" id="submitted-details">רישום זה כבר הוגש.</div>
  </div>

  <!-- Form -->
  <div id="form-screen" style="display:none">
    <div class="logo">✍️</div>
    <div class="brand">מכלול תכנון · רישום משמרת</div>
    <div class="emp-name" id="f-emp-name"></div>
    <div class="info-box">
      <div class="info-row">
        <span class="info-label">יום</span>
        <span class="info-val" id="f-day"></span>
      </div>
      <div class="info-row">
        <span class="info-label">תאריך</span>
        <span class="info-val" id="f-date"></span>
      </div>
    </div>
    <div class="window-hint">שעות פנויות: <strong id="f-window"></strong></div>
    <div class="section-title">בחר שעות הרישום שלך</div>
    <div class="time-pair">
      <div class="time-field">
        <label>שעת התחלה</label>
        <div class="time-selects">
          <select id="f-start-h"></select>
          <select id="f-start-m"><option value="00">00</option><option value="30">30</option></select>
        </div>
      </div>
      <div class="dash">–</div>
      <div class="time-field">
        <label>שעת סיום</label>
        <div class="time-selects">
          <select id="f-end-h"></select>
          <select id="f-end-m"><option value="00">00</option><option value="30">30</option></select>
        </div>
      </div>
    </div>
    <button class="btn btn-primary" id="submit-btn" onclick="submitForm()">✅ &nbsp;אשר רישום</button>
  </div>

  <!-- Success -->
  <div id="success-screen">
    <div class="big-icon">🎉</div>
    <div class="state-title green">רישום נקלט!</div>
    <div class="state-details" id="success-info"></div>
    <div class="success-time" id="success-time"></div>
    <div class="footer-note">תקבל/י הודעת אישור ממכלול תכנון</div>
  </div>

</div>
<script>
const DAYS_HE = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
let sessionData = null;
const token = new URLSearchParams(location.search).get("t");

async function init() {
  if (!token) { showError("חסר מזהה בקישור"); return; }
  try {
    const r = await fetch(`/api/remote-registrations/form/${encodeURIComponent(token)}`);
    if (!r.ok) { showError("הקישור לא תקין או שפג תוקפו"); return; }
    sessionData = await r.json();

    if (sessionData.status !== "pending") {
      document.getElementById("loading").style.display = "none";
      document.getElementById("submitted-screen").style.display = "block";
      const [yy,mm,dd] = sessionData.shift_date.split("-");
      document.getElementById("submitted-details").textContent =
        `רישום ל-${DAYS_HE[new Date(sessionData.shift_date+"T00:00:00").getDay()]} ${dd}/${mm}/${yy} כבר הוגש.`;
      return;
    }

    const [yy,mm,dd] = sessionData.shift_date.split("-");
    const heDay = DAYS_HE[new Date(sessionData.shift_date+"T00:00:00").getDay()];
    document.getElementById("f-emp-name").textContent = sessionData.employee_name;
    document.getElementById("f-day").textContent      = heDay;
    document.getElementById("f-date").textContent     = `${dd}/${mm}/${yy}`;
    document.getElementById("f-window").textContent   = `${sessionData.from_time} – ${sessionData.to_time}`;

    const fromH = parseInt(sessionData.from_time.split(":")[0]);
    const toH   = parseInt(sessionData.to_time.split(":")[0]);
    ["f-start-h","f-end-h"].forEach((id, idx) => {
      const el = document.getElementById(id);
      el.innerHTML = "";
      for (let h = fromH; h <= toH; h++) {
        const hh = String(h).padStart(2,"0");
        const sel = idx === 0 ? h === fromH : h === Math.min(fromH+1, toH);
        el.innerHTML += `<option value="${hh}" ${sel?"selected":""}>${hh}</option>`;
      }
    });

    document.getElementById("loading").style.display = "none";
    document.getElementById("form-screen").style.display = "block";
  } catch(e) { showError("שגיאת חיבור - נסה שנית"); }
}

function showError(msg) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("error-screen").style.display = "block";
  document.getElementById("error-msg").textContent = msg;
}

async function submitForm() {
  const startTime = `${document.getElementById("f-start-h").value}:${document.getElementById("f-start-m").value}`;
  const endTime   = `${document.getElementById("f-end-h").value}:${document.getElementById("f-end-m").value}`;
  if (startTime >= endTime) { alert("שעת הסיום חייבת להיות אחרי שעת ההתחלה"); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "שולח...";

  try {
    const r = await fetch("/api/remote-registrations/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, start_time: startTime, end_time: endTime })
    });
    if (!r.ok) {
      const e = await r.json();
      alert(e.detail || "שגיאה בשליחה");
      btn.disabled = false; btn.textContent = "✅ אשר רישום"; return;
    }

    const [yy,mm,dd] = sessionData.shift_date.split("-");
    const heDay = DAYS_HE[new Date(sessionData.shift_date+"T00:00:00").getDay()];
    document.getElementById("form-screen").style.display = "none";
    document.getElementById("success-screen").style.display = "block";
    document.getElementById("success-info").textContent  = `${heDay} ${dd}/${mm}/${yy}`;
    document.getElementById("success-time").textContent  = `${startTime} – ${endTime}`;
  } catch(e) { alert("שגיאת חיבור"); btn.disabled = false; btn.textContent = "✅ אשר רישום"; }
}

init();
</script>
</body>
</html>
